name: Auto Build Catalog

on:
  workflow_dispatch:
    inputs:
      max_packages_upload:
        description: 'Máx PDFs a subir en el uploader encadenado'
        required: false
        default: '100'

concurrency:
  group: auto-build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    outputs:
      changed: ${{ steps.build.outputs.changed }}
      changes: ${{ steps.build.outputs.changes }}

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install telethon boto3 requests python-dotenv

      - name: Escanear y actualizar catálogo
        id: build
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STR: ${{ secrets.TELEGRAM_SESSION_STR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_UPLOADER: '0'
          MAX_PACKAGES_UPLOAD: ${{ github.event.inputs.max_packages_upload || '100' }}
        run: python catalog_builder_light.py

  upload:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Verificar si uploader ya está corriendo
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Consultando runs activos de uploader_idrive.yml..."

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/uploader_idrive.yml/runs?per_page=20")

          ACTIVE=$(echo "$RESPONSE" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending" or .status == "requested")] | length')

          echo "Runs activos detectados: $ACTIVE"

          if [ "$ACTIVE" -gt 0 ]; then
            echo "════════════════════════════════════════"
            echo "⏸  Ya hay un uploader corriendo."
            echo "   No se dispara uno nuevo para no chocar."
            echo "════════════════════════════════════════"
            echo "$RESPONSE" | jq -r '.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending" or .status == "requested") | "   → run \(.id) [\(.status)] \(.html_url)"'
            echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Ningún uploader activo. Se puede disparar uno nuevo."
            echo "active=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar uploader
        if: steps.check.outputs.active == '0'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/uploader_idrive.yml/dispatches \
            -d '{"ref":"main","inputs":{"max_packages":"${{ github.event.inputs.max_packages_upload || '100' }}"}}'
          echo "✓ Uploader disparado"

      - name: Saltarse el uploader
        if: steps.check.outputs.active != '0'
        run: |
          echo "⏸  Uploader ya activo. El escaneo del catálogo se guardó,"
          echo "   pero no se disparó un nuevo uploader."
          echo ""
          echo "   Cuando el uploader actual termine, el próximo ciclo"
          echo "   horario volverá a intentar."
