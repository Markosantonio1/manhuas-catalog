name: Upload a BuzzHeavier

on:
  workflow_dispatch:
    inputs:
      max_packages:
        description: 'Máximo de paquetes a procesar en esta ejecución'
        required: true
        default: '5'
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run uploader
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STR: ${{ secrets.TELEGRAM_SESSION_STR }}
          MAX_PACKAGES_PER_RUN: ${{ inputs.max_packages }}
        run: |
          python uploader_buzzheavier.py

      - name: Upload catalog as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-con-ids-run${{ github.run_number }}
          path: catalog_con_ids.json
          if-no-files-found: warn
          retention-days: 30
