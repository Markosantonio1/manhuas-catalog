name: Merge catalog parts

on:
  push:
    paths:
      - 'catalog_parts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-catalog
  cancel-in-progress: false

jobs:
  merge:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip merge]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge parts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          manifest_path = Path("catalog_parts/manifest.json")
          if not manifest_path.exists():
              raise SystemExit("No existe catalog_parts/manifest.json")

          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )
          count = int(manifest["count"])

          parts = []
          for i in range(count):
              path = Path(f"catalog_parts/part_{i:03d}.bin")
              if not path.exists():
                  raise SystemExit(f"Falta {path}")
              parts.append(path.read_bytes())

          data = b"".join(parts)

          # Validar que es JSON real
          json.loads(data.decode("utf-8"))

          if len(data) != int(manifest["size"]):
              raise SystemExit("Tamaño distinto al manifiesto")

          if hashlib.sha256(data).hexdigest() != manifest["sha256"]:
              raise SystemExit("SHA-256 distinto al manifiesto")

          Path("catalog.json").write_bytes(data)
          print(f"catalog.json: {len(data)} bytes")
          PY

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json
          git rm -r --ignore-unmatch catalog_parts

          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi

          git commit -m "Merge catalog parts [skip merge]"
          git push
