name: Uploader IDrive e2

on:
  workflow_dispatch:
    inputs:
      max_packages:
        description: 'Máximo de paquetes a procesar por run'
        required: false
        default: '500'
        type: string
      chain_run:
        description: 'Número de run en la cadena (0 = primero)'
        required: false
        default: '0'
        type: string

# 🔑 Permisos necesarios para que `gh workflow run` funcione
permissions:
  contents: write     # para hacer git push del catalog.json
  actions: write      # para disparar el siguiente run

# 🛡️ Evita que dos runs se ejecuten simultáneamente sobre catalog.json
concurrency:
  group: idrive-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    # ⏱️ Red de seguridad: si el script se cuelga, GitHub lo mata a las 2h 55m
    timeout-minutes: 175

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install boto3 python-dotenv telethon requests

      - name: Run uploader
        env:
          # ── Credenciales Telegram ──
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STR: ${{ secrets.TELEGRAM_SESSION_STR }}
          # ── Credenciales IDrive e2 ──
          IDRIVE_ENDPOINT: ${{ secrets.IDRIVE_ENDPOINT }}
          IDRIVE_ACCESS_KEY: ${{ secrets.IDRIVE_ACCESS_KEY }}
          IDRIVE_SECRET_KEY: ${{ secrets.IDRIVE_SECRET_KEY }}
          IDRIVE_BUCKET: ${{ secrets.IDRIVE_BUCKET }}
          IDRIVE_REGION: ${{ secrets.IDRIVE_REGION }}
          # ── Parámetros del chain ──
          MAX_PACKAGES_PER_RUN: ${{ inputs.max_packages }}
          CHAIN_RUN: ${{ inputs.chain_run }}
          MAX_RUNTIME_SECONDS: "200"    # 2h 30m
          MAX_CHAIN_RUNS: "40"           # 40 * 2.5h = 100h
          # ── Token para git push y gh workflow run ──
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python uploader_idrive.py
